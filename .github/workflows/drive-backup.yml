name: Reusable Google Drive Repository Backup

on:
  workflow_call:
    inputs:
      drive_folder:
        description: Top-level Google Drive folder created by rclone
        required: false
        type: string
        default: Project-Backups
      retention_days:
        description: Days to retain old archives (0 disables cleanup)
        required: false
        type: number
        default: 30
      include_lfs:
        description: Download Git LFS objects (important for Unity/assets)
        required: false
        type: boolean
        default: true
      include_submodules:
        description: Checkout public submodules (private may need extra access)
        required: false
        type: boolean
        default: false
    secrets:
      RCLONE_CONFIG_B64:
        description: Base64-encoded rclone.conf containing the gdrive OAuth config
        required: true

permissions:
  contents: read

concurrency:
  group: google-drive-backup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: ${{ inputs.include_lfs }}
          submodules: ${{ inputs.include_submodules }}

      - name: Install rclone
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y rclone

      - name: Configure Google Drive
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone listremotes | grep -qx 'gdrive:'

      - name: Create timestamped source-code backup
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_DIR="$RUNNER_TEMP/source-backup"
          mkdir -p "$ARCHIVE_DIR"
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          TIMESTAMP="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          ARCHIVE_NAME="${REPO_NAME}_${TIMESTAMP}_${GITHUB_SHA:0:7}.tar.gz"
          tar -C "$GITHUB_WORKSPACE" --exclude='./.git' -czf "$ARCHIVE_DIR/$ARCHIVE_NAME" .
          printf 'ARCHIVE_NAME=%s\n' "$ARCHIVE_NAME" >> "$GITHUB_ENV"
          printf 'ARCHIVE_DIR=%s\n' "$ARCHIVE_DIR" >> "$GITHUB_ENV"
          echo "Created repository snapshot: $ARCHIVE_NAME"

      - name: Upload archive to Google Drive
        shell: bash
        env:
          DRIVE_FOLDER: ${{ inputs.drive_folder }}
        run: |
          set -euo pipefail
          rclone copyto \
            "$ARCHIVE_DIR/$ARCHIVE_NAME" \
            "gdrive:$DRIVE_FOLDER/$GITHUB_REPOSITORY/$ARCHIVE_NAME" \
            --retries 3 --low-level-retries 10 --stats 15s

      - name: Verify backup matches Google Drive file
        shell: bash
        env:
          DRIVE_FOLDER: ${{ inputs.drive_folder }}
        run: |
          set -euo pipefail
          rclone check \
            "$ARCHIVE_DIR" \
            "gdrive:$DRIVE_FOLDER/$GITHUB_REPOSITORY" \
            --include "$ARCHIVE_NAME" \
            --one-way
          echo 'Backup uploaded and verified.'

      - name: Delete expired archives
        if: ${{ inputs.retention_days > 0 }}
        shell: bash
        env:
          DRIVE_FOLDER: ${{ inputs.drive_folder }}
          RETENTION_DAYS: ${{ inputs.retention_days }}
        run: |
          set -euo pipefail
          rclone delete \
            "gdrive:$DRIVE_FOLDER/$GITHUB_REPOSITORY" \
            --include '*.tar.gz' \
            --max-depth 1 \
            --min-age "${RETENTION_DAYS}d"
